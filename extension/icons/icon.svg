<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Squircle background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2f36" />
      <stop offset="100%" stop-color="#16171a" />
    </linearGradient>

    <!-- Border stroke gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4e515d" />
      <stop offset="100%" stop-color="#23252a" />
    </linearGradient>

    <!-- YouTube Red gradient -->
    <linearGradient id="ytRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1a1a" />
      <stop offset="100%" stop-color="#cc0000" />
    </linearGradient>

    <!-- Tray/Bracket metallic gradient -->
    <linearGradient id="trayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3333" />
      <stop offset="100%" stop-color="#aa0000" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#cc0000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base Badge -->
  <rect x="36" y="36" width="440" height="440" rx="105" ry="105"
        fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" filter="url(#dropShadow)" />

  <!-- Inner ambient rim -->
  <rect x="40" y="40" width="432" height="432" rx="101" ry="101"
        fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2" />

  <!-- YouTube Play Screen Screen Body -->
  <g filter="url(#softGlow)">
    <rect x="136" y="125" width="240" height="165" rx="42" ry="42" fill="url(#ytRed)" />
    <!-- White Play Triangle -->
    <polygon points="234,175 234,240 292,207.5" fill="#ffffff" />
  </g>

  <!-- Download Arrow pointing downwards from the play badge -->
  <g filter="url(#softGlow)">
    <!-- Arrow Stem -->
    <rect x="236" y="278" width="40" height="45" fill="url(#ytRed)" />
    <!-- Arrow Head -->
    <polygon points="200,320 312,320 256,368" fill="url(#ytRed)" />
  </g>

  <!-- Local Server / Tray Bracket -->
  <g>
    <!-- Bracket base outline -->
    <path d="M 160,335 L 160,390 Q 160,402 172,402 L 340,402 Q 352,402 352,390 L 352,335"
          fill="none" stroke="url(#trayGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Storage Tray Floor / LED accent -->
    <line x1="184" y1="390" x2="328" y2="390" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-opacity="0.9" />
  </g>
</svg>

