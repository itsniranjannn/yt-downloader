<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Red glow filter -->
    <filter id="neonRedGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="28" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- White glow filter -->
    <filter id="whiteGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Pure Deep Pitch Black Background - Sharp 90-degree square, full frame -->
  <rect x="0" y="0" width="512" height="512" fill="#040507" />

  <!-- Ambient Red Backlight -->
  <circle cx="256" cy="240" r="140" fill="#ff0015" opacity="0.22" filter="url(#neonRedGlow)" />

  <!-- Vibrant YouTube Red Screen with Soft Glow -->
  <g filter="url(#neonRedGlow)">
    <rect x="110" y="130" width="292" height="198" rx="46" ry="46" fill="#ff051b" />
    <!-- White Play Triangle -->
    <polygon points="228,190 228,268 304,229" fill="#ffffff" />
  </g>

  <!-- Bright Glowing White Download Arrow & Bracket -->
  <g filter="url(#whiteGlow)">
    <!-- Download Arrow Stem -->
    <rect x="306" y="210" width="40" height="90" fill="#ffffff" />
    <!-- Download Arrow Head -->
    <polygon points="270,290 382,290 326,348" fill="#ffffff" />

    <!-- Storage / Server Bracket Base -->
    <path d="M 276,346 L 276,378 Q 276,394 292,394 L 360,394 Q 376,394 376,378 L 376,346"
          fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
